name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        options:
          - Full
          - Backend
          - Frontend
        default: Full
      install_deps:
        description: Install dependencies (yarn install)
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Full deploy
        if: ${{ inputs.target == 'Full' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_IP }}
          username: root
          port: 23
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_BRANCH,INSTALL_DEPS
          script_path: .github/workflows/full-deploy.sh
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          INSTALL_DEPS: ${{ inputs.install_deps }}

      - name: Backend deploy
        if: ${{ inputs.target == 'Backend' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_IP }}
          username: root
          port: 23
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_BRANCH,INSTALL_DEPS
          script_path: .github/workflows/be-deploy.sh
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          INSTALL_DEPS: ${{ inputs.install_deps }}

      - name: Frontend deploy
        if: ${{ inputs.target == 'Frontend' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SERVER_IP }}
          username: root
          port: 23
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_BRANCH,INSTALL_DEPS
          script_path: .github/workflows/fe-deploy.sh
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
          INSTALL_DEPS: ${{ inputs.install_deps }}

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.deploy.result }}"
          TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi

          printf -v MESSAGE '%s Manual Deploy [%s] (%s) finished at %s: %s\n%s' "$EMOJI" "${{ inputs.target }}" "${{ github.ref_name }}" "$TIMESTAMP" "$STATUS" "$RUN_URL"

          curl -s \
            -X POST \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            --data-urlencode "text=$MESSAGE"
